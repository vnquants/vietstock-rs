# Copied from theoldman9/ProjectAmaterasu (libs/finance-vietstock-rs) at commit e409960,
# then moved from reqwest + a Chromium fallback to wreq with Chrome TLS/HTTP2 emulation.
[package]
name = "vietstock-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/vnquants/vietstock-rs"
readme = "README.md"
description = "Rust client for the Vietstock Finance API (finance.vietstock.vn): statement tables, documents, events"
keywords = ["vietstock", "vietnam", "finance", "financial-statements", "filings"]
categories = ["api-bindings", "finance"]

[lib]
name = "vietstock"

[dependencies]
# HTTP with browser TLS/HTTP2 fingerprint emulation instead of a headless browser.
# Same pinned versions as tradingview-rs. Building BoringSSL needs cmake, clang and perl.
#
# No `deflate` and no wreq-util `emulation-compression`: when offered deflate,
# finance.vietstock.vn answers with raw deflate (no zlib header), which wreq cannot
# decode (checked 2026-11-19). wreq then advertises only gzip/br/zstd and the server
# picks gzip.
wreq = { version = "=6.0.0-rc.31", features = ["cookies", "json", "gzip", "brotli", "zstd"] }
wreq-util = { version = "=3.0.0-rc.14", features = ["emulation"] }
form_urlencoded = "1"

chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Paused clock for the rate-limiter tests.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "warn"
expect_used = "warn"
todo = "deny"
unimplemented = "deny"
